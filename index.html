<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Norvet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
        #cart-panel { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        #cart-panel.open { transform: translateX(0); }
        #cart-badge { position: absolute; top: -0.5rem; right: -0.5rem; background-color: #dc2626; color: white; font-size: 0.75rem; border-radius: 9999px; width: 1.25rem; height: 1.25rem; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="container max-w-lg mx-auto p-4 pb-20">
        <h1 class="text-3xl font-bold text-red-800 text-center my-6">Pedidos Norvet</h1>

        <input type="text" id="search" placeholder="Buscar por código o producto..." 
               class="w-full p-4 rounded-xl border border-gray-300 focus:ring-4 focus:ring-indigo-300 text-lg mb-4">

        <div id="products" class="space-y-3"></div>
    </div>

    <button id="cart-btn" class="fixed bottom-6 right-6 bg-indigo-600 text-white p-4 rounded-full shadow-2xl hover:bg-indigo-700 z-40">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span id="cart-badge" class="hidden">0</span>
    </button>

    <div id="cart-panel" class="fixed inset-y-0 right-0 w-full max-w-md bg-white shadow-2xl z-50 flex flex-col">
        <div class="bg-indigo-700 text-white p-4 flex justify-between items-center">
            <h2 class="text-2xl font-bold">Tu Pedido</h2>
            <button id="close-cart" class="text-3xl">×</button>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <div class="relative mb-4">
                <input type="text" id="client-name" placeholder="Buscar cliente por nombre..." autocomplete="off"
                       class="w-full p-3 border rounded-lg text-lg" required>
                <div id="client-suggestions" class="hidden absolute z-10 left-0 right-0 mt-1 bg-white border rounded-lg shadow-xl max-h-64 overflow-y-auto"></div>
                <div id="client-selected-info" class="hidden text-sm text-gray-600 mt-1 px-1"></div>
            </div>

            <p class="text-sm text-gray-600 mb-4"><strong>Fecha:</strong> <span id="order-date"></span></p>

            <div id="cart-items" class="space-y-3 mb-6"></div>

            <textarea id="observations" placeholder="Observaciones (opcional): urgente, factura, envío, etc." class="w-full p-3 border rounded-lg h-24 resize-none"></textarea>

            <button id="continue-shopping" class="w-full mt-4 bg-gray-200 text-gray-800 font-bold py-3 rounded-xl hover:bg-gray-300 transition">
                ← Seguir comprando
            </button>
        </div>

        <div class="border-t p-4 bg-gray-50">
            <div class="flex justify-between text-2xl font-bold mb-4">
                <span>Total:</span>
                <span id="total-display" class="text-indigo-700">$0.00</span>
            </div>
            <button id="send-order" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl text-xl hover:bg-green-700">
                Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>

        let carrito = {};

        document.getElementById('order-date').textContent = new Date().toLocaleString('es-MX');

        function render() {
            const container = document.getElementById('products');
            container.innerHTML = '';
            const term = document.getElementById('search').value.toLowerCase();
            Object.keys(CATALOGO).sort().forEach(sku => {
                const p = CATALOGO[sku];
                if (sku.toLowerCase().includes(term) || p.desc.toLowerCase().includes(term)) {
                    const div = document.createElement('div');
                    div.className = 'bg-white rounded-xl shadow p-4 flex justify-between items-center';
                    div.innerHTML = `
                        <div>
                            <div class="font-bold">${p.desc}</div>
                            <div class="text-sm text-gray-600">${sku} • $${p.price}</div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="add('${sku}', -1)" class="w-10 h-10 bg-red-100 rounded-full">-</button>
                            <span class="font-bold text-xl w-12 text-center">${carrito[sku]||0}</span>
                            <button onclick="add('${sku}', 1)" class="w-10 h-10 bg-green-100 rounded-full">+</button>
                        </div>
                    `;
                    container.appendChild(div);
                }
            });
            updateCart();
        }

        function add(sku, delta) {
            const qty = (carrito[sku] || 0) + delta;
            if (qty <= 0) delete carrito[sku];
            else carrito[sku] = qty;
            render();
            saveDraft();
        }

        function updateCart() {
            const count = Object.values(carrito).reduce((a,b)=>a+b,0);
            document.getElementById('cart-badge').textContent = count;
            document.getElementById('cart-badge').classList.toggle('hidden', count===0);

            let total = 0;
            const itemsDiv = document.getElementById('cart-items');
            itemsDiv.innerHTML = '';
            Object.keys(carrito).forEach(sku => {
                const p = CATALOGO[sku];
                const subtotal = carrito[sku] * p.price;
                total += subtotal;
                itemsDiv.innerHTML += `
                    <div class="flex justify-between items-center py-2 border-b">
                        <div>
                            <div class="font-medium">${carrito[sku]} × ${p.desc}</div>
                            <div class="text-sm text-gray-600">${sku}</div>
                        </div>
                        <div class="font-bold">$ ${subtotal}</div>
                    </div>
                `;
            });
            document.getElementById('total-display').textContent = total.toLocaleString('es-MX', {style:'currency', currency:'MXN'});
        }

        // Buscador de clientes con autocompletado
        let selectedCliente = null;
        const clientInput = document.getElementById('client-name');
        const clientSuggestions = document.getElementById('client-suggestions');
        const clientSelectedInfo = document.getElementById('client-selected-info');

        function renderClientSuggestions() {
            const term = clientInput.value.trim().toLowerCase();
            if (!term) { clientSuggestions.classList.add('hidden'); clientSuggestions.innerHTML = ''; return; }

            const matches = CLIENTES.filter(c =>
                c.nombre.toLowerCase().includes(term) || c.sap.toLowerCase().includes(term)
            ).slice(0, 8);

            if (matches.length === 0) { clientSuggestions.classList.add('hidden'); clientSuggestions.innerHTML = ''; return; }

            clientSuggestions.innerHTML = matches.map(c => `
                <div class="client-suggestion p-3 border-b last:border-b-0 hover:bg-indigo-50 cursor-pointer" data-sap="${c.sap}">
                    <div class="font-medium">${c.nombre}</div>
                    <div class="text-xs text-gray-500">${c.sap} • ${c.vendedor}${c.municipio ? ' • ' + c.municipio : ''}</div>
                </div>
            `).join('');
            clientSuggestions.classList.remove('hidden');

            clientSuggestions.querySelectorAll('.client-suggestion').forEach(el => {
                el.addEventListener('click', () => {
                    const c = CLIENTES.find(x => x.sap === el.dataset.sap);
                    selectedCliente = c;
                    clientInput.value = c.nombre;
                    clientSuggestions.classList.add('hidden');
                    clientSuggestions.innerHTML = '';
                    clientSelectedInfo.textContent = `${c.sap} • Vendedor: ${c.vendedor}${c.dir ? ' • ' + c.dir : ''}`;
                    clientSelectedInfo.classList.remove('hidden');
                    saveDraft();
                });
            });
        }

        clientInput.addEventListener('input', () => {
            selectedCliente = null;
            clientSelectedInfo.classList.add('hidden');
            renderClientSuggestions();
            saveDraft();
        });
        clientInput.addEventListener('focus', renderClientSuggestions);
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#client-name') && !e.target.closest('#client-suggestions')) {
                clientSuggestions.classList.add('hidden');
            }
        });

        // Guardar avance del pedido para no perderlo si se cierra o recarga la página por error
        const DRAFT_KEY = 'pedidosNorvetDraft';
        const observationsInput = document.getElementById('observations');

        function saveDraft() {
            try {
                localStorage.setItem(DRAFT_KEY, JSON.stringify({
                    carrito: carrito,
                    clientName: clientInput.value,
                    clienteSap: selectedCliente ? selectedCliente.sap : null,
                    observaciones: observationsInput.value
                }));
            } catch (e) {}
        }

        function loadDraft() {
            try {
                const raw = localStorage.getItem(DRAFT_KEY);
                if (!raw) return;
                const draft = JSON.parse(raw);
                if (draft.carrito) carrito = draft.carrito;
                if (draft.clientName) clientInput.value = draft.clientName;
                if (draft.clienteSap) {
                    const c = CLIENTES.find(x => x.sap === draft.clienteSap);
                    if (c) {
                        selectedCliente = c;
                        clientSelectedInfo.textContent = `${c.sap} • Vendedor: ${c.vendedor}${c.dir ? ' • ' + c.dir : ''}`;
                        clientSelectedInfo.classList.remove('hidden');
                    }
                }
                if (draft.observaciones) observationsInput.value = draft.observaciones;
            } catch (e) {}
        }

        function clearDraft() {
            carrito = {};
            selectedCliente = null;
            clientInput.value = '';
            clientSelectedInfo.classList.add('hidden');
            observationsInput.value = '';
            localStorage.removeItem(DRAFT_KEY);
        }

        observationsInput.addEventListener('input', saveDraft);

        window.addEventListener('beforeunload', (e) => {
            if (Object.keys(carrito).length > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        document.getElementById('send-order').addEventListener('click', () => {
            const cliente = clientInput.value.trim();
            if (!cliente) return alert("Escribe o selecciona el cliente");
            if (Object.keys(carrito).length === 0) return alert("El carrito está vacío");

            let lineas = Object.keys(carrito).map(sku =>
                `${sku} - ${CATALOGO[sku].desc} **(${carrito[sku]})**`
            ).join('%0A');

            const obs = document.getElementById('observations').value.trim();
            const total = document.getElementById('total-display').textContent;

            const clienteInfo = (selectedCliente && selectedCliente.nombre === cliente)
                ? `*Cliente:* ${selectedCliente.nombre} (${selectedCliente.sap})%0A*Vendedor:* ${selectedCliente.vendedor}%0A*Dirección:* ${selectedCliente.dir}%0A`
                : `*Cliente:* ${cliente} (nuevo, no está en la lista)%0A*Vendedor:* Sin nombre%0A`;

            const mensaje = `*NUEVO PEDIDO NORVET*%0A%0A` +
                clienteInfo +
                `*Fecha:* ${new Date().toLocaleString('es-MX')}%0A%0A` +
                lineas + `%0A%0A` +
                (obs ? `*Observaciones:* ${obs}%0A%0A` : '') +
                `*Total:* ${total}%0A%0A` +
                `App de Pedidos NORVET`;

            window.open(`https://wa.me/?text=${mensaje}`, '_blank');

            clearDraft();
            render();
        });

        // Abrir/cerrar carrito
        const cartPanel = document.getElementById('cart-panel');
        document.getElementById('cart-btn').addEventListener('click', () => cartPanel.classList.add('open'));
        document.getElementById('close-cart').addEventListener('click', () => cartPanel.classList.remove('open'));
        document.getElementById('continue-shopping').addEventListener('click', () => cartPanel.classList.remove('open'));

        document.getElementById('search').addEventListener('input', render);
        loadDraft();
        render();
    </script>
